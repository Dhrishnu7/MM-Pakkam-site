<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mudhalvar Marundhagam Pakkam</title>
    <meta name="description" content="Secure login to Mudhalvar Marundhagam Pakkam pharmacy billing system.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Background Blobs ── */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: blobFloat 8s ease-in-out infinite;
            pointer-events: none;
        }
        .blob-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #0ea5e9, #0284c7);
            top: -200px; left: -150px;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #10b981, #059669);
            bottom: -150px; right: -100px;
            animation-delay: -3s;
        }
        .blob-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #8b5cf6, #6d28d9);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }
        @keyframes blobFloat {
            0%, 100% { transform: scale(1) translate(0, 0); }
            33%       { transform: scale(1.08) translate(20px, -15px); }
            66%       { transform: scale(0.95) translate(-15px, 20px); }
        }

        /* Grid overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* ── Login Card ── */
        .login-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 440px;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 28px;
            padding: 3rem 2.8rem;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05),
                0 40px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
            animation: cardIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo ── */
        .login-logo {
            display: flex; flex-direction: column; align-items: center;
            gap: 14px; margin-bottom: 2.2rem; text-align: center;
        }
        .login-logo-icon {
            width: 64px; height: 64px; border-radius: 20px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9, #10b981);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 900; font-size: 1.5rem; letter-spacing: 0.5px;
            box-shadow: 0 8px 32px rgba(14,165,233,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            position: relative; overflow: hidden;
        }
        .login-logo-icon::after {
            content: ''; position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0%{left:-100%} 20%{left:200%} 100%{left:200%} }

        .login-logo-title {
            font-size: 1.15rem; font-weight: 800; color: white;
            letter-spacing: -0.01em; line-height: 1.3;
        }
        .login-logo-sub {
            font-size: 0.78rem; color: rgba(148,163,184,1);
            margin-top: 2px; font-weight: 500;
        }

        /* ── Heading ── */
        .login-heading {
            margin-bottom: 1.8rem; text-align: center;
        }
        .login-heading h1 {
            font-size: 1.55rem; font-weight: 800; color: white;
            letter-spacing: -0.02em; margin-bottom: 0.3rem;
        }
        .login-heading p {
            font-size: 0.85rem; color: rgba(148,163,184,1);
        }

        /* ── Form Groups ── */
        .form-group { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 1.2rem; }
        .form-group label {
            font-size: 0.73rem; font-weight: 800; letter-spacing: 0.07em;
            text-transform: uppercase; color: rgba(148,163,184,1);
        }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            opacity: 0.45; pointer-events: none;
            display: flex; align-items: center;
        }
        .form-group input {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem; color: white;
            background: rgba(255,255,255,0.07);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 0.82rem 1rem 0.82rem 2.8rem;
            outline: none; width: 100%;
            transition: all 0.25s ease;
        }
        .form-group input::placeholder { color: rgba(148,163,184,0.5); }
        .form-group input:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .form-group input:focus {
            background: rgba(14,165,233,0.1);
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14,165,233,0.15);
        }

        /* Password toggle */
        .pw-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: rgba(148,163,184,0.6); padding: 4px; border-radius: 6px;
            transition: color 0.2s;
            display: flex; align-items: center;
        }
        .pw-toggle:hover { color: rgba(148,163,184,1); }

        /* ── Remember Me ── */
        .remember-row {
            display: flex; align-items: center; gap: 9px;
            margin-bottom: 1.6rem; cursor: pointer;
        }
        .remember-row input[type="checkbox"] { display: none; }
        .custom-check {
            width: 18px; height: 18px; border-radius: 5px;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.07);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.2s ease;
        }
        .custom-check svg { opacity: 0; transition: opacity 0.15s; }
        input[type="checkbox"]:checked + .custom-check {
            background: #0ea5e9; border-color: #0ea5e9;
        }
        input[type="checkbox"]:checked + .custom-check svg { opacity: 1; }
        .remember-label { font-size: 0.85rem; color: rgba(148,163,184,1); user-select: none; }

        /* ── Login Button ── */
        .login-btn {
            width: 100%; padding: 0.9rem 1.5rem;
            border-radius: 12px; border: none; cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem; font-weight: 800; letter-spacing: 0.01em;
            background: linear-gradient(135deg, #0ea5e9, #0284c7, #0369a1);
            color: white;
            box-shadow: 0 4px 20px rgba(14,165,233,0.4);
            transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            position: relative; overflow: hidden;
        }
        .login-btn::before {
            content: ''; position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(14,165,233,0.55);
        }
        .login-btn:hover::before { left: 200%; transition: left 0.5s ease; }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ── Error Message ── */
        .error-msg {
            display: none; align-items: center; gap: 9px;
            background: rgba(239,68,68,0.1);
            border: 1.5px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 0.75rem 1rem;
            margin-bottom: 1.3rem;
            animation: shake 0.4s ease;
        }
        .error-msg.show { display: flex; }
        @keyframes shake {
            0%,100%{ transform:translateX(0) }
            20%    { transform:translateX(-5px) }
            40%    { transform:translateX(5px) }
            60%    { transform:translateX(-3px) }
            80%    { transform:translateX(3px) }
        }
        .error-msg span {
            font-size: 0.85rem; font-weight: 600; color: #fca5a5;
        }

        /* ── Spinner ── */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.7s linear infinite; }

        /* ── Footer note ── */
        .login-footer {
            text-align: center; margin-top: 1.8rem;
            font-size: 0.75rem; color: rgba(100,116,139,0.8);
        }
        .login-footer a {
            color: rgba(148,163,184,0.7); text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-card { padding: 2.2rem 1.6rem; }
        }
    </style>
    <script src="js/auth.js"></script>
</head>
<body>

    <!-- Animated blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="login-wrap">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <div class="login-logo-icon">MM</div>
                <div>
                    <div class="login-logo-title">Mudhalvar Marundhagam Pakkam</div>
                    <div class="login-logo-sub">Pharmacy Billing System</div>
                </div>
            </div>

            <!-- Heading -->
            <div class="login-heading">
                <h1>Welcome back 👋</h1>
                <p>Sign in to access your dashboard</p>
            </div>

            <!-- Error -->
            <div class="error-msg" id="errorMsg">
                <svg width="16" height="16" fill="none" stroke="#f87171" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                </svg>
                <span id="errorText">Invalid username or password.</span>
            </div>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

                <!-- Username -->
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </span>
                        <input type="text" id="loginUsername" placeholder="Enter your username"
                               autocomplete="username" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="loginPassword" placeholder="Enter your password"
                               autocomplete="current-password" required>
                        <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()"
                                aria-label="Show/hide password">
                            <svg id="eyeIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <label class="remember-row" for="rememberMe">
                    <input type="checkbox" id="rememberMe">
                    <div class="custom-check">
                        <svg width="10" height="10" fill="none" stroke="white" stroke-width="3" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                    <span class="remember-label">Keep me signed in on this device</span>
                </label>

                <!-- Submit -->
                <button type="submit" class="login-btn" id="loginBtn">
                    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                &copy; 2026 Mudhalvar Marundhagam Pakkam &mdash; Secured Access
            </div>
        </div>
    </div>

    <script>
        // Redirect if already logged in
        if (mmGetSession()) {
            window.location.replace('index.html');
        }
        // Redirect to setup if no owner yet
        if (!mmHasUsers()) {
            window.location.replace('setup.html');
        }

        function togglePw() {
            const inp = document.getElementById('loginPassword');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;
            } else {
                inp.type = 'password';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn      = document.getElementById('loginBtn');
            const errDiv   = document.getElementById('errorMsg');
            const errText  = document.getElementById('errorText');
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;

            errDiv.classList.remove('show');

            if (!username || !password) {
                errText.textContent = 'Please enter both username and password.';
                errDiv.classList.add('show');
                return;
            }

            // Loading state
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="spinner" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/>
                </svg>
                Signing in…`;

            const result = await mmLogin(username, password, remember);

            if (result.success) {
                btn.innerHTML = `
                    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                    Welcome, ${result.user.username}!`;
                setTimeout(() => window.location.replace('index.html'), 600);
            } else {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Sign In`;
                errText.textContent = result.message;
                errDiv.classList.add('show');
            }
        }

        // Press Enter to submit
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
        });
    </script>
</body>
</html>

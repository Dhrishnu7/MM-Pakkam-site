<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts Ledger | Billware</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/supabase.js"></script>
    <script src="js/auth.js?v=3"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0f172a 50%, #0d1627 100%);
            display: flex;
            flex-direction: column;
            color: #f1f5f9;
        }

        /* ── Navbar ── */
        header {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 0.85rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }

        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(217,119,6,0.4);
            flex-shrink: 0;
        }
        .logo-text {
            font-size: 1.1rem; font-weight: 800; color: #f1f5f9;
            letter-spacing: -0.01em;
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 0.5rem 1.1rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            font-size: 0.85rem; font-weight: 600; color: #94a3b8;
            cursor: pointer; transition: all 0.2s ease; text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #f1f5f9;
            transform: translateX(-2px);
        }

        /* ── Page Content ── */
        .page-content {
            flex: 1; padding: 2.5rem 1.5rem 4rem;
            max-width: 1100px; margin: 0 auto; width: 100%;
            animation: fadeUp 0.5s ease forwards; opacity: 0;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Page Header ── */
        .page-header { margin-bottom: 2rem; }
        .page-tag {
            font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em;
            text-transform: uppercase; color: #f59e0b; margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .page-tag::before {
            content: '';
            display: inline-block; width: 20px; height: 2px;
            background: #f59e0b; border-radius: 2px;
        }
        .page-header h1 {
            font-size: 2rem; font-weight: 900; color: #f1f5f9;
            letter-spacing: -0.03em; line-height: 1.1;
        }
        .page-header p { color: #475569; margin-top: 6px; font-size: 0.92rem; font-weight: 500; }

        /* ── Stat Card ── */
        .stat-card {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #1e1050 0%, #0f172a 60%);
            border: 1px solid rgba(245,158,11,0.2);
            border-radius: 24px; padding: 2rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
            margin-bottom: 2rem;
            display: flex; align-items: center; justify-content: space-between; gap: 2rem;
        }
        .stat-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, #d97706, #f59e0b, #fbbf24);
        }
        .stat-card::after {
            content: '';
            position: absolute; top: -60px; right: -40px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(245,158,11,0.12), transparent 70%);
            pointer-events: none;
        }
        .stat-left { display: flex; flex-direction: column; gap: 4px; }
        .stat-label {
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.12em; color: #f59e0b;
        }
        .stat-value {
            font-size: 3rem; font-weight: 900; color: #fbbf24;
            letter-spacing: -0.04em; line-height: 1;
        }
        .stat-sub { font-size: 0.78rem; color: #475569; margin-top: 4px; font-weight: 500; }
        .stat-icon {
            width: 56px; height: 56px; border-radius: 16px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(217,119,6,0.4);
            font-size: 1.5rem; flex-shrink: 0;
        }

        /* ── Search ── */
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; padding: 0.7rem 1.2rem;
            margin-bottom: 1.5rem;
        }
        .search-bar input {
            flex: 1; background: none; border: none; outline: none;
            color: #f1f5f9; font-size: 0.9rem; font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        .search-bar input::placeholder { color: #475569; }

        /* ── Grid ── */
        .khata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
        }

        /* ── Customer Card ── */
        .customer-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative; overflow: hidden;
        }
        .customer-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, #ef4444, #f97316);
            opacity: 0; transition: opacity 0.2s;
        }
        .customer-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            border-color: rgba(239,68,68,0.3);
        }
        .customer-card:hover::before { opacity: 1; }

        .c-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .c-avatar {
            width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.1rem; color: white;
            flex-shrink: 0;
        }
        .c-info { flex: 1; padding-left: 0.8rem; }
        .c-name { font-size: 1rem; font-weight: 800; color: #f1f5f9; }
        .c-phone { font-size: 0.8rem; color: #475569; margin-top: 2px; font-weight: 500; }

        .c-bal-section {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.15);
            border-radius: 12px; padding: 0.9rem 1rem;
        }
        .c-bal-label { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #f87171; }
        .c-bal-value {
            font-size: 1.7rem; font-weight: 900; color: #ef4444;
            letter-spacing: -0.02em; margin-top: 2px; line-height: 1;
        }

        .btn-settle {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; border-radius: 12px;
            padding: 0.8rem 0; width: 100%; font-weight: 700;
            font-size: 0.9rem; font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 7px;
            box-shadow: 0 4px 16px rgba(16,185,129,0.25);
        }
        .btn-settle:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(16,185,129,0.4);
        }

        /* ── Empty State ── */
        .empty-state {
            text-align: center; padding: 4rem 1rem;
            color: #475569; grid-column: 1 / -1;
        }
        .empty-icon {
            font-size: 3rem; margin-bottom: 1rem;
            opacity: 0.4;
        }
        .empty-state h3 { font-size: 1.15rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 700; }
        .empty-state p { font-size: 0.875rem; color: #334155; }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .modal {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 2rem; width: 90%; max-width: 400px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
            transform: scale(0.94) translateY(10px);
            transition: transform 0.25s ease;
            position: relative; overflow: hidden;
        }
        .modal::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, #10b981, #34d399);
        }
        .modal-overlay.open .modal { transform: scale(1) translateY(0); }
        .modal h2 { font-size: 1.3rem; font-weight: 800; color: #f1f5f9; margin-bottom: 0.4rem; }
        .modal p { color: #475569; font-size: 0.88rem; margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1.4rem; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 700;
            color: #64748b; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.06em;
        }
        .form-group input {
            width: 100%; padding: 0.9rem 1.2rem;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #f1f5f9;
            font-size: 1.2rem; font-weight: 700; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16,185,129,0.12);
        }

        .modal-actions { display: flex; gap: 0.8rem; }
        .btn-cancel {
            flex: 1; background: rgba(255,255,255,0.06);
            color: #64748b; border: 1px solid rgba(255,255,255,0.1);
            padding: 0.9rem; border-radius: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.1); color: #94a3b8; }
        .btn-confirm {
            flex: 1; background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none;
            padding: 0.9rem; border-radius: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 14px rgba(16,185,129,0.3);
        }
        .btn-confirm:hover { background: linear-gradient(135deg, #059669, #047857); }

        @media (max-width: 600px) {
            header { padding: 0.75rem 1rem; }
            .page-content { padding: 1.5rem 1rem 3rem; }
            .stat-value { font-size: 2.2rem; }
            .stat-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <script>
        mmRequireAuth();
        document.addEventListener('DOMContentLoaded', () => mmInjectUserBar());
    </script>

    <header>
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <mask id="km"><rect width="100" height="100" fill="white"/><rect x="42" y="32" width="16" height="36" rx="4" fill="black"/><rect x="32" y="42" width="36" height="16" rx="4" fill="black"/></mask>
                        <g id="kleaf"><path d="M 50 50 C 35 45, 30 30, 30 20 C 30 10, 45 10, 50 20 C 55 10, 70 10, 70 20 C 70 30, 65 45, 50 50 Z" fill="#ffffff"/></g>
                    </defs>
                    <g mask="url(#km)">
                        <use href="#kleaf"/><use href="#kleaf" transform="rotate(90 50 50)"/>
                        <use href="#kleaf" transform="rotate(180 50 50)"/><use href="#kleaf" transform="rotate(270 50 50)"/>
                    </g>
                </svg>
            </div>
            <div class="logo-text" id="shopNameHeader">Loading...</div>
        </a>
        <a href="javascript:history.back()" class="back-btn">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Back
        </a>
    </header>

    <div class="page-content">
        <div class="page-header">
            <div class="page-tag">Accounts Ledger</div>
            <h1>Credit Accounts</h1>
            <p>Track and manage pending payments from your customers.</p>
        </div>

        <!-- Stat Banner -->
        <div class="stat-card">
            <div class="stat-left">
                <div class="stat-label">Total Outstanding Dues</div>
                <div class="stat-value" id="totalOutstanding">₹0.00</div>
                <div class="stat-sub">Across all credit customers</div>
            </div>
            <div class="stat-icon">💰</div>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <svg width="16" height="16" fill="none" stroke="#475569" stroke-width="2.5" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search customer name..." oninput="filterKhata(this.value)">
        </div>

        <div class="khata-grid" id="khataGrid">
            <div style="text-align:center;padding:3rem;color:#475569;grid-column:1/-1;">Loading accounts...</div>
        </div>
    </div>

    <!-- Settle Dues Modal -->
    <div class="modal-overlay" id="settleModal">
        <div class="modal">
            <h2 id="modalTitle">Settle Dues</h2>
            <p id="modalSub">Record a payment from this customer.</p>
            <div class="form-group">
                <label>Amount Received (₹)</label>
                <input type="number" id="settleAmount" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button type="button" class="btn-confirm" onclick="confirmSettle()">✓ Save Payment</button>
            </div>
        </div>
    </div>

    <script>
        let currentCustIndex = -1;
        let _khataCustomers = [];
        let _allKhataCustomers = [];

        // ── Load shop name ──
        (async function loadShopName() {
            try {
                const profile = await dbGetShopProfile();
                const name = (profile && profile.shop_name) ? profile.shop_name
                           : localStorage.getItem('mm_shop_name') || 'My Shop';
                document.getElementById('shopNameHeader').textContent = name;
            } catch(e) {
                document.getElementById('shopNameHeader').textContent = localStorage.getItem('mm_shop_name') || 'My Shop';
            }
        })();

        // ── Filter ──
        function filterKhata(query) {
            const q = (query || '').trim().toLowerCase();
            _khataCustomers = q
                ? _allKhataCustomers.filter(c => c.name.toLowerCase().includes(q))
                : [..._allKhataCustomers];
            renderKhata();
        }

        async function loadAndRenderKhata() {
            const grid = document.getElementById('khataGrid');
            let debtors = [];

            try {
                if (typeof dbGetKhataData === 'function') {
                    const rows = await dbGetKhataData();
                    if (rows && rows.length > 0) {
                        debtors = rows.map(r => ({
                            id:      r.id,
                            name:    r.name    || '',
                            phone:   r.phone   || '',
                            address: r.address || '',
                            balance: parseFloat(r.balance) || 0,
                        }));
                    }
                }
            } catch(e) { console.warn('Supabase khata load failed, falling back to localStorage', e); }

            if (debtors.length === 0) {
                const customers = JSON.parse(localStorage.getItem('mm_customers') || '[]');
                debtors = customers
                    .filter(c => parseFloat(c.balance || 0) > 0)
                    .map(c => ({ id: null, name: c.name, phone: c.phone || '', address: c.address || '', balance: parseFloat(c.balance) }));
            }

            _allKhataCustomers = debtors.sort((a, b) => b.balance - a.balance);
            _khataCustomers = [..._allKhataCustomers];
            renderKhata();
        }

        function getInitials(name) {
            return (name || '?').split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
        }

        function renderKhata() {
            const grid = document.getElementById('khataGrid');
            const totalEl = document.getElementById('totalOutstanding');
            const debtors = _khataCustomers;

            // Total across ALL customers (not just filtered)
            const grandTotal = _allKhataCustomers.reduce((s, c) => s + c.balance, 0);
            totalEl.textContent = '₹' + grandTotal.toFixed(2);

            if (debtors.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">😊</div>
                        <h3>No Pending Dues!</h3>
                        <p>All your customers' accounts are clear.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = '';
            debtors.forEach((cust, idx) => {
                const card = document.createElement('div');
                card.className = 'customer-card';
                card.innerHTML = `
                    <div class="c-header">
                        <div class="c-avatar">${getInitials(cust.name)}</div>
                        <div class="c-info">
                            <div class="c-name">${cust.name}</div>
                            <div class="c-phone">${cust.phone || 'No phone added'}</div>
                        </div>
                    </div>
                    <div class="c-bal-section">
                        <div class="c-bal-label">Pending Balance</div>
                        <div class="c-bal-value">₹${cust.balance.toFixed(2)}</div>
                    </div>
                    <button class="btn-settle" onclick="openSettleModal(${_allKhataCustomers.indexOf(cust)}, '${cust.name.replace(/'/g, "\\'")}', ${cust.balance})">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        Mark as Settled
                    </button>`;
                grid.appendChild(card);
            });
        }

        function openSettleModal(index, name, currentBalance) {
            currentCustIndex = index;
            document.getElementById('modalTitle').textContent = `Settle: ${name}`;
            document.getElementById('modalSub').textContent = `Current Balance: ₹${currentBalance.toFixed(2)}`;
            const amtInput = document.getElementById('settleAmount');
            amtInput.value = currentBalance.toFixed(2);
            document.getElementById('settleModal').classList.add('open');
            setTimeout(() => { amtInput.focus(); amtInput.select(); }, 100);
        }

        function closeModal() {
            document.getElementById('settleModal').classList.remove('open');
            currentCustIndex = -1;
        }

        async function confirmSettle() {
            if (currentCustIndex < 0) return;
            const amount = parseFloat(document.getElementById('settleAmount').value);
            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount greater than 0.");
                return;
            }
            const cust = _allKhataCustomers[currentCustIndex];
            if (!cust) return;

            if (amount > cust.balance) {
                if (!confirm(`The amount (₹${amount}) is greater than the pending balance (₹${cust.balance}). This will result in an advance payment. Continue?`)) return;
            }

            cust.balance = Math.max(0, parseFloat((cust.balance - amount).toFixed(2)));

            try {
                if (cust.id && typeof _supabase !== 'undefined') {
                    await _supabase.from('customers').update({ balance: cust.balance }).eq('id', cust.id);
                }
            } catch(e) { console.warn('Settle sync failed:', e); }

            const customers = JSON.parse(localStorage.getItem('mm_customers') || '[]');
            const lc = customers.find(c => (c.name || '').toLowerCase() === cust.name.toLowerCase());
            if (lc) { lc.balance = cust.balance; localStorage.setItem('mm_customers', JSON.stringify(customers)); }

            if (cust.balance <= 0) _allKhataCustomers.splice(currentCustIndex, 1);
            _khataCustomers = [..._allKhataCustomers];

            closeModal();
            renderKhata();
        }

        document.addEventListener('DOMContentLoaded', loadAndRenderKhata);
    </script>
</body>
</html>

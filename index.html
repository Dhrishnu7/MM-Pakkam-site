<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudhalvar Marundhagam Pakkam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #0284c7;
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 4rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .section-card {
            background: white;
            border-radius: 12px;
            padding: 3rem 2rem;
            width: 250px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid #e5e7eb;
        }
        .section-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: #0284c7;
        }
        .section-card h2 {
            margin: 0;
            color: #0284c7;
            font-size: 1.5rem;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mudhalvar Marundhagam Pakkam</h1>
    </header>

    <div class="dashboard">
        <!-- ADD CUSTOMER Section -->
        <div class="section-card">
            <div class="icon">👤</div>
            <h2>ADD CUSTOMER</h2>
        </div>

        <!-- ADD DOCTOR Section -->
        <div class="section-card">
            <div class="icon">👨‍⚕️</div>
            <h2>ADD DOCTOR</h2>
        </div>

        <!-- PURCHASE Section -->
        <div class="section-card">
            <div class="icon">📦</div>
            <h2>PURCHASE</h2>
        </div>

        <!-- SALES Section -->
        <div class="section-card">
            <div class="icon">🛒</div>
            <h2>SALES</h2>
        </div>
    </div>

</body>
</html>

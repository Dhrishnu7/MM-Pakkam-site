<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer | Mudhalvar Marundhagam Pakkam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:   #2563eb;
            --border: rgba(255,255,255,0.1);
            --input-bg: rgba(255,255,255,0.05);
            --ease:   cubic-bezier(.4,0,.2,1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #06111f;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 50% at 10% 10%, rgba(37,99,235,.3) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 90% 90%, rgba(16,185,129,.2) 0%, transparent 60%);
            z-index: 0;
        }

        body > * { position: relative; z-index: 1; }

        /* ── Navbar ── */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 3rem;
            background: rgba(6,17,31,.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-badge {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #0d9488);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1rem; color: white;
            box-shadow: 0 0 16px rgba(37,99,235,.4);
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,.07);
            border: 1px solid var(--border);
            padding: .5rem 1.2rem;
            border-radius: 50px;
            font-size: .85rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: all .25s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255,255,255,.12);
            color: white;
        }

        /* ── Page header ── */
        .page-header {
            max-width: 900px;
            margin: 3.5rem auto 0;
            padding: 0 2rem;
            animation: fadeUp .6s var(--ease) forwards;
            opacity: 0;
        }

        .breadcrumb {
            font-size: .8rem;
            color: #475569;
            margin-bottom: 1rem;
        }
        .breadcrumb span { color: #2563eb; }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
            letter-spacing: -.02em;
        }
        .page-header p {
            color: #64748b;
            margin-top: .5rem;
            font-size: 1rem;
        }

        /* ── Form card ── */
        .form-wrapper {
            max-width: 900px;
            margin: 2.5rem auto 5rem;
            padding: 0 2rem;
            animation: fadeUp .7s var(--ease) .15s forwards;
            opacity: 0;
        }

        .form-card {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px;
            padding: 3rem;
            backdrop-filter: blur(20px);
        }

        /* ── Form sections ── */
        .form-section {
            margin-bottom: 2.5rem;
        }

        .form-section-title {
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #2563eb;
            margin-bottom: 1.5rem;
            padding-bottom: .75rem;
            border-bottom: 1px solid rgba(37,99,235,.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-grid.full { grid-template-columns: 1fr; }
        .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: .5rem;
        }

        .form-group label {
            font-size: .85rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            padding: .85rem 1rem;
            font-size: .95rem;
            color: white;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color .25s, box-shadow .25s, background .25s;
            width: 100%;
        }

        .form-group select option {
            background: #0f172a;
            color: white;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #334155;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.2);
            background: rgba(255,255,255,.08);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* ── Divider ── */
        .divider { border: none; border-top: 1px solid rgba(255,255,255,.07); margin: 2.5rem 0; }

        /* ── Buttons ── */
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: .8rem 2rem;
            border-radius: 12px;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            transition: all .25s var(--ease);
        }

        .btn-ghost {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.1);
            color: #94a3b8;
        }
        .btn-ghost:hover { background: rgba(255,255,255,.12); color: white; }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 4px 20px rgba(37,99,235,.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37,99,235,.5);
        }
        .btn-primary:active { transform: translateY(0); }

        /* ── Success toast ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #064e3b;
            border: 1px solid #059669;
            border-radius: 14px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: .95rem;
            font-weight: 600;
            color: #34d399;
            box-shadow: 0 20px 40px rgba(0,0,0,.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all .4s var(--ease);
            z-index: 999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* ── Animation ── */
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0);    }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            nav { padding: 1rem 1.5rem; }
            .logo-text { display: none; }
            .form-card { padding: 1.5rem; }
            .form-grid, .form-grid.three { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column-reverse; }
            .btn { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-logo" onclick="window.location.href='index.html'">
            <div class="logo-badge">M</div>
            <span class="logo-text">Mudhalvar Marundhagam Pakkam</span>
        </div>
        <a href="index.html" class="back-btn">
            &#8592; Back to Home
        </a>
    </nav>

    <!-- Page Heading -->
    <div class="page-header">
        <div class="breadcrumb">Home &rsaquo; <span>Add Customer</span></div>
        <h1>Add New Customer</h1>
        <p>Fill in the details below to register a new customer in the system.</p>
    </div>

    <!-- Form -->
    <div class="form-wrapper">
        <div class="form-card">
            <form id="customerForm" onsubmit="handleSubmit(event)">

                <!-- Personal Details -->
                <div class="form-section">
                    <div class="form-section-title">Personal Information</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" placeholder="e.g. Ramesh" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" placeholder="e.g. Kumar" required>
                        </div>
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob">
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender">
                                <option value="" disabled selected>Select gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <!-- Contact Details -->
                <div class="form-section">
                    <div class="form-section-title">Contact Details</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" placeholder="e.g. 9876543210" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="e.g. ramesh@email.com">
                        </div>
                    </div>
                    <div class="form-grid full" style="margin-top:1.5rem">
                        <div class="form-group">
                            <label for="address">Address</label>
                            <textarea id="address" placeholder="Door no., Street, Area, City..."></textarea>
                        </div>
                    </div>
                    <div class="form-grid three" style="margin-top:1.5rem">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" placeholder="e.g. Chennai">
                        </div>
                        <div class="form-group">
                            <label for="state">State</label>
                            <input type="text" id="state" placeholder="e.g. Tamil Nadu">
                        </div>
                        <div class="form-group">
                            <label for="pincode">Pincode</label>
                            <input type="text" id="pincode" placeholder="e.g. 600001">
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <!-- Medical Details -->
                <div class="form-section">
                    <div class="form-section-title">Medical Information</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="doctor">Referring Doctor</label>
                            <input type="text" id="doctor" placeholder="Doctor's name (optional)">
                        </div>
                        <div class="form-group">
                            <label for="bloodGroup">Blood Group</label>
                            <select id="bloodGroup">
                                <option value="" disabled selected>Select blood group</option>
                                <option>A+</option><option>A-</option>
                                <option>B+</option><option>B-</option>
                                <option>O+</option><option>O-</option>
                                <option>AB+</option><option>AB-</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid full" style="margin-top:1.5rem">
                        <div class="form-group">
                            <label for="allergies">Known Allergies / Medical Notes</label>
                            <textarea id="allergies" placeholder="e.g. Allergic to penicillin, diabetic..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="button" class="btn btn-ghost" onclick="window.location.href='index.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                        Save Customer
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        Customer saved successfully!
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="animation:spin .7s linear infinite"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Saving...`;

            setTimeout(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Saved!`;

                setTimeout(() => {
                    toast.classList.remove('show');
                    btn.disabled = false;
                    btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg> Save Customer`;
                    document.getElementById('customerForm').reset();
                }, 3000);
            }, 1000);
        }

        document.head.insertAdjacentHTML('beforeend', `<style>@keyframes spin{to{transform:rotate(360deg)}}</style>`);
    </script>

</body>
</html>

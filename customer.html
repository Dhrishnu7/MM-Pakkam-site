<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer | Mudhalvar Marundhagam Pakkam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #f8faff;
            overflow-x: hidden;
        }

        /* Background blobs */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% -10%, rgba(99,102,241,0.10) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 0% 80%, rgba(14,165,233,0.08) 0%, transparent 55%),
                radial-gradient(ellipse 40% 40% at 100% 20%, rgba(16,185,129,0.07) 0%, transparent 55%);
            z-index: 0;
            pointer-events: none;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: blobFloat 8s ease-in-out infinite alternate;
        }
        .blob-1 { width: 380px; height: 380px; background: #c7d2fe; top: -100px; right: -80px; }
        .blob-2 { width: 300px; height: 300px; background: #a7f3d0; bottom: -60px; left: -60px; animation-delay: 3s; }

        @keyframes blobFloat {
            from { transform: scale(1); }
            to   { transform: scale(1.08) translate(10px, -10px); }
        }

        body > * { position: relative; z-index: 1; }

        /* ── Navbar ── */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(99,102,241,0.1);
            box-shadow: 0 1px 30px rgba(99,102,241,0.06);
            padding: 0 3rem;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-logo {
            width: 44px; height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #0ea5e9);
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 6px 20px rgba(99,102,241,0.3);
            flex-shrink: 0;
        }

        .nav-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #1e1b4b;
            letter-spacing: -0.02em;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1.2rem;
            background: white;
            border: 1.5px solid rgba(99,102,241,0.2);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #6366f1;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            box-shadow: 0 2px 10px rgba(99,102,241,0.08);
        }
        .back-btn:hover {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
            box-shadow: 0 6px 20px rgba(99,102,241,0.3);
            transform: translateY(-1px);
        }

        /* ── Page Header ── */
        .page-header {
            max-width: 860px;
            margin: 3rem auto 0;
            padding: 0 2rem;
            animation: fadeUp 0.6s ease forwards;
            opacity: 0;
        }

        .breadcrumb {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }
        .breadcrumb a:hover { text-decoration: underline; }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 900;
            color: #1e1b4b;
            letter-spacing: -0.03em;
        }

        .page-header p {
            color: #9ca3af;
            margin-top: 0.4rem;
            font-size: 0.95rem;
        }

        /* ── Form Card ── */
        .form-wrapper {
            max-width: 860px;
            margin: 2rem auto 5rem;
            padding: 0 2rem;
            animation: fadeUp 0.7s ease 0.1s forwards;
            opacity: 0;
        }

        .form-card {
            background: white;
            border-radius: 28px;
            border: 1.5px solid rgba(99,102,241,0.08);
            box-shadow: 0 8px 40px rgba(99,102,241,0.07);
            padding: 3rem;
            overflow: hidden;
        }

        /* ── Section Titles ── */
        .form-section { margin-bottom: 2.5rem; }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #6366f1;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid rgba(99,102,241,0.1);
        }

        .section-title .title-icon {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: rgba(99,102,241,0.1);
            display: flex; align-items: center; justify-content: center;
        }

        .section-title .title-icon svg {
            width: 15px; height: 15px;
            stroke: #6366f1;
            stroke-width: 2;
        }

        /* ── Grid Layouts ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.4rem; }
        .grid-1 { display: grid; grid-template-columns: 1fr; gap: 1.4rem; }
        .mt { margin-top: 1.4rem; }

        /* ── Form Groups ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #374151;
            letter-spacing: 0.01em;
        }

        .form-group label .req {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            color: #111827;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #d1d5db;
        }

        .form-group input:hover,
        .form-group select:hover,
        .form-group textarea:hover {
            border-color: #c7d2fe;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }

        .form-group select option { color: #111827; background: white; }
        .form-group textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 1.5px solid #f3f4f6;
            margin: 2.5rem 0;
        }

        /* ── Action Buttons ── */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1.5px solid #f3f4f6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            letter-spacing: -0.01em;
        }

        .btn-cancel {
            background: #f3f4f6;
            color: #6b7280;
            border: 1.5px solid #e5e7eb;
        }
        .btn-cancel:hover {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-save {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            box-shadow: 0 4px 16px rgba(99,102,241,0.3);
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99,102,241,0.4);
        }
        .btn-save:active { transform: translateY(0); }
        .btn-save:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            border: 1.5px solid #d1fae5;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #065f46;
            box-shadow: 0 10px 40px rgba(16,185,129,0.15);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            z-index: 999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: #d1fae5;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .toast-icon svg { stroke: #059669; stroke-width: 2.5; }

        /* ── Animation ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            nav { padding: 0 1.2rem; }
            .nav-title { font-size: 0.85rem; }
            .form-card { padding: 1.5rem; }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column-reverse; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Navbar -->
    <nav>
        <a class="nav-brand" href="index.html">
            <div class="nav-logo">M</div>
            <span class="nav-title">Mudhalvar Marundhagam Pakkam</span>
        </a>
        <a class="back-btn" href="index.html">
            &#8592; Back to Home
        </a>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span>&#8250;</span>
            <span>Add Customer</span>
        </div>
        <h1>Add New Customer</h1>
        <p>Fill in the details below to register a new customer in the system.</p>
    </div>

    <!-- Form -->
    <div class="form-wrapper">
        <div class="form-card">
            <form id="customerForm" onsubmit="handleSubmit(event)" novalidate>

                <!-- Personal Information -->
                <div class="form-section">
                    <div class="section-title">
                        <div class="title-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </div>
                        Personal Information
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>First Name <span class="req">*</span></label>
                            <input type="text" id="firstName" placeholder="e.g. Ramesh" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name <span class="req">*</span></label>
                            <input type="text" id="lastName" placeholder="e.g. Kumar" required>
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="dob">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender">
                                <option value="" disabled selected>Select gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <!-- Contact Details -->
                <div class="form-section">
                    <div class="section-title">
                        <div class="title-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                        </div>
                        Contact Details
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Phone Number <span class="req">*</span></label>
                            <input type="tel" id="phone" placeholder="e.g. 9876543210" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="email" placeholder="e.g. ramesh@email.com">
                        </div>
                    </div>
                    <div class="grid-1 mt">
                        <div class="form-group">
                            <label>Address</label>
                            <textarea id="address" placeholder="Door no., Street, Area, City..."></textarea>
                        </div>
                    </div>
                    <div class="grid-3 mt">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="city" placeholder="e.g. Chennai">
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" id="state" placeholder="e.g. Tamil Nadu">
                        </div>
                        <div class="form-group">
                            <label>Pincode</label>
                            <input type="text" id="pincode" placeholder="e.g. 600001">
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <!-- Medical Information -->
                <div class="form-section">
                    <div class="section-title">
                        <div class="title-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        </div>
                        Medical Information
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Referring Doctor</label>
                            <input type="text" id="doctor" placeholder="Doctor's name (optional)">
                        </div>
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select id="bloodGroup">
                                <option value="" disabled selected>Select blood group</option>
                                <option>A+</option><option>A-</option>
                                <option>B+</option><option>B-</option>
                                <option>O+</option><option>O-</option>
                                <option>AB+</option><option>AB-</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-1 mt">
                        <div class="form-group">
                            <label>Known Allergies / Medical Notes</label>
                            <textarea id="allergies" placeholder="e.g. Allergic to penicillin, diabetic patient..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="window.location.href='index.html'">Cancel</button>
                    <button type="submit" class="btn btn-save" id="saveBtn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        Save Customer
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        </div>
        <div>
            <div style="font-weight:700; color:#065f46;">Customer Saved!</div>
            <div style="font-size:0.8rem; color:#6ee7b7; margin-top:2px;">Record added successfully.</div>
        </div>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName  = document.getElementById('lastName').value.trim();
            const phone     = document.getElementById('phone').value.trim();

            if (!firstName || !lastName || !phone) {
                // Highlight missing required fields
                ['firstName','lastName','phone'].forEach(id => {
                    const el = document.getElementById(id);
                    if (!el.value.trim()) {
                        el.style.borderColor = '#ef4444';
                        el.style.boxShadow   = '0 0 0 4px rgba(239,68,68,0.1)';
                        el.addEventListener('input', () => {
                            el.style.borderColor = '';
                            el.style.boxShadow   = '';
                        }, { once: true });
                    }
                });
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin .7s linear infinite"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg> Saving...`;

            setTimeout(() => {
                // Show toast
                const toast = document.getElementById('toast');
                toast.classList.add('show');

                btn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Saved!`;

                setTimeout(() => {
                    toast.classList.remove('show');
                    btn.disabled = false;
                    btn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Save Customer`;
                    document.getElementById('customerForm').reset();
                }, 3000);
            }, 1000);
        }
    </script>

</body>
</html>

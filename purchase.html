<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase | Mudhalvar Marundhagam Pakkam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-color: #fffbeb;
            background-image:
                radial-gradient(at 0% 0%, hsla(43,96%,88%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(160,84%,90%,1) 0px, transparent 50%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            color: #0f172a;
        }

        /* ── Navbar ── */
        header {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            width: 42px; height: 42px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0ea5e9, #10b981);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(14,165,233,0.3);
            flex-shrink: 0;
        }
        .logo-text {
            font-size: 1.2rem; font-weight: 700; color: #0f172a;
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 0.5rem 1.2rem;
            background: white;
            border: 1.5px solid rgba(245,158,11,0.3);
            border-radius: 50px;
            font-size: 0.85rem; font-weight: 600; color: #d97706;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .back-btn:hover {
            background: #f59e0b; color: white; border-color: #f59e0b;
            box-shadow: 0 4px 16px rgba(245,158,11,0.35);
            transform: translateY(-1px);
        }

        /* ── Page Content ── */
        .page-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem 4rem;
        }

        /* ── Page Header ── */
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }
        .breadcrumb {
            font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.6rem;
        }
        .breadcrumb a { color: #d97706; text-decoration: none; font-weight: 500; }
        .page-header h1 {
            font-size: 1.9rem; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;
        }
        .page-header p { color: #64748b; margin-top: 0.4rem; font-size: 0.95rem; }

        /* ── Form Card ── */
        .form-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            animation: fadeUp 0.6s ease 0.1s forwards;
            opacity: 0;
        }

        /* ── Grid Layout ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem 1.4rem;
        }
        .full-width { grid-column: 1 / -1; }

        /* ── Form Groups ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #92400e;
        }

        .form-group input {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #0f172a;
            background: #fafaf8;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            outline: none;
            width: 100%;
            transition: all 0.22s ease;
        }
        .form-group input::placeholder { color: #cbd5e1; }

        .form-group input:hover {
            border-color: #fcd34d;
            background: white;
        }
        .form-group input:focus {
            border-color: #f59e0b;
            background: white;
            box-shadow: 0 0 0 4px rgba(245,158,11,0.12);
        }
        .form-group input[readonly] {
            font-weight: 700;
            color: #92400e;
            background: #fef3c7;
            border-color: #fcd34d;
            cursor: default;
        }

        /* ── Divider ── */
        .divider {
            grid-column: 1 / -1;
            height: 1.5px;
            background: linear-gradient(90deg, #fde68a, transparent);
            margin: 0.4rem 0;
            border-radius: 2px;
        }

        /* ── Buttons ── */
        .form-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 2rem;
        }
        .btn {
            flex: 1;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 0.9rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem; font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer; border: none;
            transition: all 0.25s ease;
        }
        .btn-cancel {
            background: #f1f5f9; color: #64748b; border: 1.5px solid #e2e8f0;
        }
        .btn-cancel:hover { background: #e2e8f0; color: #334155; }

        .btn-save {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 4px 16px rgba(245,158,11,0.35);
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(245,158,11,0.45);
        }
        .btn-save:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            background: white;
            border: 1.5px solid #fde68a;
            border-radius: 16px;
            padding: 1rem 1.4rem;
            display: flex; align-items: center; gap: 12px;
            font-size: 0.9rem; font-weight: 600; color: #92400e;
            box-shadow: 0 10px 30px rgba(245,158,11,0.18);
            transform: translateY(100px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            z-index: 999;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon {
            width: 32px; height: 32px; border-radius: 50%;
            background: #fef3c7;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 580px) {
            header { padding: 0.8rem 1rem; }
            .logo-text { font-size: 0.95rem; }
            .form-card { padding: 1.8rem 1.2rem; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: 1; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <a class="logo" href="index.html">
            <div class="logo-icon">M</div>
            <span class="logo-text">Mudhalvar Marundhagam Pakkam</span>
        </a>
        <a class="back-btn" href="index.html">&#8592; Back</a>
    </header>

    <!-- Page Content -->
    <div class="page-content">

        <div class="page-header">
            <div class="breadcrumb"><a href="index.html">Home</a> &rsaquo; Purchase</div>
            <h1>Add Purchase</h1>
            <p>Fill in the purchase details below</p>
        </div>

        <div class="form-card">
            <form id="purchaseForm" onsubmit="handleSubmit(event)" novalidate>
                <div class="form-grid">

                    <!-- Row 1: Bill No, Firm -->
                    <div class="form-group">
                        <label>Bill No</label>
                        <input type="text" id="billNo" placeholder="e.g. BL-001">
                    </div>
                    <div class="form-group">
                        <label>Firm</label>
                        <input type="text" id="firm" placeholder="e.g. Sun Pharma">
                    </div>

                    <!-- Date full width -->
                    <div class="form-group full-width">
                        <label>Date</label>
                        <input type="date" id="purchaseDate">
                    </div>

                    <div class="divider"></div>

                    <!-- Product Name full width -->
                    <div class="form-group full-width">
                        <label>Product Name</label>
                        <input type="text" id="productName" placeholder="e.g. Paracetamol 500mg">
                    </div>

                    <!-- Batch No, Expire Date -->
                    <div class="form-group">
                        <label>Batch No</label>
                        <input type="text" id="batchNo" placeholder="e.g. BT20240001">
                    </div>
                    <div class="form-group">
                        <label>Expire Date</label>
                        <input type="month" id="expireDate">
                    </div>

                    <!-- Quantity, MRP -->
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="quantity" placeholder="0" min="0">
                    </div>
                    <div class="form-group">
                        <label>MRP (₹)</label>
                        <input type="number" id="mrp" placeholder="0.00" min="0" step="0.01">
                    </div>

                    <!-- Rate, GST -->
                    <div class="form-group">
                        <label>Rate (₹)</label>
                        <input type="number" id="rate" placeholder="0.00" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>GST (%)</label>
                        <input type="number" id="gst" placeholder="e.g. 12" min="0" max="100" step="0.01">
                    </div>

                    <!-- Total full width -->
                    <div class="form-group full-width">
                        <label>Total (₹)</label>
                        <input type="text" id="total" placeholder="Auto-calculated" readonly>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="window.location.href='index.html'">Cancel</button>
                    <button type="submit" class="btn btn-save" id="saveBtn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                        Save Purchase
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon">
            <svg width="16" height="16" fill="none" stroke="#d97706" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <div>
            <div style="font-weight:800;">Purchase Saved!</div>
            <div style="font-size:0.78rem; color:#fbbf24; margin-top:2px;">Record added successfully.</div>
        </div>
    </div>

    <script>
        // ── Default today's date ──
        document.getElementById('purchaseDate').valueAsDate = new Date();

        // ── Auto-calculate Total: (Qty × Rate) + GST% ──
        function calcTotal() {
            const qty  = parseFloat(document.getElementById('quantity').value) || 0;
            const rate = parseFloat(document.getElementById('rate').value)     || 0;
            const gst  = parseFloat(document.getElementById('gst').value)      || 0;
            const base = qty * rate;
            const total = base + (base * gst / 100);
            document.getElementById('total').value = total > 0 ? '₹ ' + total.toFixed(2) : '';
        }
        ['quantity', 'rate', 'gst'].forEach(id =>
            document.getElementById(id).addEventListener('input', calcTotal)
        );

        // ── Submit ──
        function handleSubmit(e) {
            e.preventDefault();

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin .7s linear infinite"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg> Saving...`;

            setTimeout(() => {
                document.getElementById('toast').classList.add('show');
                btn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Saved!`;

                setTimeout(() => {
                    document.getElementById('toast').classList.remove('show');
                    btn.disabled = false;
                    btn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Save Purchase`;
                    document.getElementById('purchaseForm').reset();
                    document.getElementById('purchaseDate').valueAsDate = new Date();
                }, 3000);
            }, 900);
        }
    </script>

</body>
</html>
